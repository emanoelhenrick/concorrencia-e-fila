services:
  postgres:
    image: postgres:16-alpine
    container_name: estoque-concorrente-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estoque_concorrente
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: estoque-concorrente-redis
    restart: unless-stopped
    ports:
      - "6379:6379"